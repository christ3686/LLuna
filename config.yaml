# LLuna v7.1 Configuration
# Tool Execution Integrity + Anti-Hallucination + Loop Discipline

llm:
  ollama:
    base_url: "http://localhost:11434"
    default_model: "llama3.2"
    keep_alive: "10m"
  lmstudio:
    base_url: "http://localhost:1234"
    default_model: "local-model"

agent:
  max_iterations: 20
  temperature: 0.7
  max_tokens: 2048
  max_context_tokens: 4096
  timeout: 120
  auto_execute: false  # KEEP FALSE for integrity

# Loop Discipline (model-specific limits auto-detected)
loop_discipline:
  confidence_threshold: 0.75  # Early exit threshold
  abort_on_repeat: 2          # Repeated conclusion limit

# Integrity Settings
integrity:
  validate_output: true       # Require actual output for success
  detect_hallucination: true  # Block external state claims
  detect_instruction_fallback: true  # Block "you should run..."
  track_valid_paths: true     # Only allow paths from tool output

startup:
  auto_mount: true

mcpServers:
  filesystem_your_descrition:
    command: "python"
    args: ["mcp_servers/your_mcp_server.py"]
    enabled: true
    description: "Read files"
    category: "filesystem"

  
